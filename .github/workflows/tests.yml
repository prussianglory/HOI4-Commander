name: Проверки прототипа
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Системные библиотеки Qt для Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Установка зависимостей
        run: python -m pip install -e ".[dev,windows]"
      - name: Проверка запуска Qt без дисплея
        run: |
          python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); print('Qt offscreen: OK')"
      - name: Тесты без реальной игры
        run: python -m pytest -q
      - name: Полный мок-сценарий
        run: python -m hoi4_commander.cli demo --mock-execute
