[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hoi4-ai-commander"
version = "0.1.0"
description = "Внешний агент мирного управления HOI4 с проверкой игровых действий"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "numpy>=2,<3", "opencv-python-headless>=4.10,<5", "mss>=10,<11", "httpx>=0.28,<1"]

[project.optional-dependencies]
windows = ["PyDirectInput>=1.0.4; sys_platform == 'win32'", "PySide6>=6.8,<7"]
dev = ["pytest>=8,<10"]

[project.scripts]
hoi4-commander = "hoi4_commander.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
